buildscript {
    ext {
        buildToolsVersion = "33.0.0"
        minSdkVersion = 21
        compileSdkVersion = 33
        targetSdkVersion = 33
        ndkVersion = "23.1.7779620"
        kotlinVersion = "1.8.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:7.3.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.1")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}

// Required for RN 0.72 + force a stable Facebook SDK version
subprojects {
    configurations.all {
        resolutionStrategy {
            dependencySubstitution {
                substitute module('com.facebook.react:react-native') using module('com.facebook.react:react-android:+')
            }
            // ✅ Force a specific Facebook SDK version to avoid snapshot repo timeout
            eachDependency { DependencyResolveDetails details ->
                if (details.requested.group == 'com.facebook.android' && details.requested.name == 'facebook-android-sdk') {
                    details.useVersion '18.3.0'   // use the latest stable from the list you shared
                }
            }
            // ✅ react-native-image-picker's ImagePickerModuleImpl.java uses the
            // AndroidX Photo Picker APIs (PickVisualMedia, PickVisualMediaRequest,
            // PickMultipleVisualMedia), which only exist from androidx.activity
            // 1.7.0+. Whatever older version is transitively pulled in doesn't
            // have them, and that module compiles as its own Gradle project, so
            // an app-level `implementation(...)` dependency doesn't reach it —
            // this project-wide force does.
            force 'androidx.activity:activity:1.7.0'
        }
    }

    // ✅ NEW: Force all modules (including react-native-image-picker) to use the same compileSdk (33)
    // This avoids the broken android-35 platform on the GitHub runner.
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            android {
                compileSdkVersion rootProject.ext.compileSdkVersion
            }
        }
    }
}
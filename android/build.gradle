buildscript {
    ext {
        buildToolsVersion = "33.0.0"
        minSdkVersion = 21
        compileSdkVersion = 33
        targetSdkVersion = 33
        ndkVersion = "23.1.7779620"
        kotlinVersion = "1.8.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:7.3.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.1")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}

subprojects {
    configurations.all {
        resolutionStrategy {
            dependencySubstitution {
                substitute module('com.facebook.react:react-native') using module('com.facebook.react:react-android:+')
            }
            // 🔥 Force older versions of libraries that demand compileSdk 34
            force 'androidx.credentials:credentials:1.0.0'
            force 'androidx.credentials:credentials-play-services-auth:1.0.0'
            force 'androidx.datastore:datastore-core-android:1.0.0'
            force 'androidx.datastore:datastore-preferences-core-android:1.0.0'
            force 'androidx.datastore:datastore-android:1.0.0'
            force 'androidx.datastore:datastore-preferences-android:1.0.0'
        }
    }

    // Force Java 17 for every Android module (this already works)
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
                // No kotlinOptions here – it breaks non‑Kotlin modules
            }
        }
    }
}
name: Build iOS IPA

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14        # Apple Silicon — fastest free tier for iOS
    permissions:
      contents: write

    env:
      HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      # ── Code Signing ────────────────────────────────────────────────────
      # Option A: Ad-Hoc / Development IPA (no Apple account needed by builder)
      # Your friend installs via AltStore / Sideloadly with their own Apple ID.
      #
      # To use this option, leave APPLE_CERTIFICATE / PROFILE secrets empty
      # and set SIGN_METHOD=adhoc.  The build will be unsigned; your friend
      # signs it locally with Sideloadly (free).
      #
      # Option B: Apple Developer account → set all secrets below and
      # set SIGN_METHOD=appstore or SIGN_METHOD=adhoc with a real profile.
      # ────────────────────────────────────────────────────────────────────

      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create a temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Import certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Install provisioning profile
        if: env.HAS_PROFILE == 'true'
        env:
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/AbdoBest.mobileprovision

      # ── Build (unsigned — for Sideloadly distribution) ──────────────────
      - name: Build unsigned IPA (no Apple account needed)
        if: env.HAS_CERT == 'false'
        run: |
          xcodebuild \
            -workspace ios/AbdoBest.xcworkspace \
            -scheme AbdoBest \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            | xcpretty --color || true

          # Package into IPA manually (no signing)
          mkdir -p Payload
          cp -r "$(find ios/build -name 'AbdoBest.app' | head -1)" Payload/
          zip -r AbdoBest-unsigned.ipa Payload
          rm -rf Payload

      # ── Build (signed — requires Apple Developer secrets) ───────────────
      - name: Build signed IPA
        if: env.HAS_CERT == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -workspace ios/AbdoBest.xcworkspace \
            -scheme AbdoBest \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            -archivePath ios/AbdoBest.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive \
            | xcpretty --color

          xcodebuild \
            -exportArchive \
            -archivePath ios/AbdoBest.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath ios/output \
            | xcpretty --color

          mv ios/output/*.ipa AbdoBest-signed.ipa

      # ── Upload ───────────────────────────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbdoBest-iOS
          path: |
            AbdoBest-unsigned.ipa
            AbdoBest-signed.ipa
          if-no-files-found: ignore

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AbdoBest-unsigned.ipa
            AbdoBest-signed.ipa
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
